services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ufc
      POSTGRES_PASSWORD: ufc
      POSTGRES_DB: ufc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ufc"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
